<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Siswa - Portal Sekolah</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="logo.png">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <!-- Bagian Logo & Judul -->
            <div class="logo-section">
                <img src="logo.png" alt="Logo Sekolah" class="logo">
                <h2>Portal Siswa</h2>
                <p class="subtitle">Silakan masuk untuk mengakses akun Anda</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">NIS / Nama Pengguna</label>
                    <input type="text" id="username" placeholder="Masukkan Nomor Induk Siswa" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" placeholder="Masukkan kata sandi" required>
                    <span id="togglePassword" class="eye-icon">👁️</span>
                </div>

                <div id="errorMsg" class="error-message"></div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">Masuk ke Akun</span>
                </button>
            </form>

            <p class="info">
                <strong>Contoh akun:</strong><br>
                NIS: <b>siswa123</b> | Kata Sandi: <b>123456</b>
            </p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
