<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda Siswa</title>
    <link rel="stylesheet" href="database.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="logo.png" alt="Logo Sekolah" class="logo">
            <div class="header-info">
                <h1>Portal Siswa</h1>
                <p id="namaSiswa"></p>
            </div>
            <button id="btnKeluar" class="btn-keluar">Keluar</button>
        </header>

        <main>
            <!-- Data Diri -->
            <section class="card">
                <h2>📋 Data Diri</h2>
                <div class="info-row">
                    <span>NIS:</span> <strong id="nis"></strong>
                </div>
                <div class="info-row">
                    <span>Nama Lengkap:</span> <strong id="nama"></strong>
                </div>
                <div class="info-row">
                    <span>Kelas:</span> <strong id="kelas"></strong>
                </div>
            </section>

            <!-- Daftar Nilai -->
            <section class="card">
                <h2>📊 Daftar Nilai</h2>
                <table id="tabelNilai">
                    <thead>
                        <tr>
                            <th>Mata Pelajaran</th>
                            <th>Nilai</th>
                            <th>Keterangan</th>
                        </tr>
                    </thead>
                    <tbody id="daftarNilai"></tbody>
                </table>
                <div class="rata-rata">
                    Rata-rata: <strong id="rataRata"></strong>
                </div>
            </section>
        </main>
    </div>

    <script>
        

        // Tampilkan data siswa
        document.getElementById("namaSiswa").textContent = siswa.nama;
        document.getElementById("nis").textContent = siswa.nis;
        document.getElementById("nama").textContent = siswa.nama;
        document.getElementById("kelas").textContent = siswa.kelas;

        // Tampilkan nilai
        const tbody = document.getElementById("daftarNilai");
        let total = 0;
        let jumlahMapel = 0;

        for (const [mapel, nilai] of Object.entries(siswa.nilai)) {
            total += nilai;
            jumlahMapel++;
            const status = nilai >= 75 
                ? "<span class='lulus'>Lulus</span>" 
                : "<span class='tidak-lulus'>Perlu Perbaikan</span>";
            
            tbody.innerHTML += `
                <tr>
                    <td>${mapel}</td>
                    <td class="nilai">${nilai}</td>
                    <td>${status}</td>
                </tr>
            `;
        }

        // Hitung rata-rata
        const rataRata = (total / jumlahMapel).toFixed(2);
        document.getElementById("rataRata").textContent = rataRata;

        // Fungsi Keluar
        document.getElementById("btnKeluar").addEventListener("click", () => {
            localStorage.removeItem("siswaAktif");
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
